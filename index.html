<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BrevetLéa</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#f0f4ff;font-family:'Nunito',sans-serif;min-height:100vh}
:root{--lea:#f472b6;--lea2:#fb923c;--gn:#22c55e;--rd:#ef4444;--go:#f5c842;--ac:#7c6af7;--s:#111827;--s2:#1f2937;--b:rgba(255,255,255,.07)}
.app{min-height:100vh;background:radial-gradient(ellipse 70% 50% at 15% 10%,rgba(244,114,182,.09),transparent 60%),radial-gradient(ellipse 50% 40% at 85% 85%,rgba(124,106,247,.1),transparent 50%),#0a0e1a}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 80px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(17,24,39,.95);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:100}
.logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.logo span{color:var(--lea)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:10px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;transition:all .2s;width:100%}
.blea{background:linear-gradient(135deg,var(--lea),var(--lea2));color:#fff}
.blea:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(244,114,182,.3)}
.bgh{background:var(--s2);color:#f0f4ff;border:1px solid var(--b);width:auto}
.bgh:hover{background:var(--s)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:14px}
.lrow{display:flex;align-items:flex-end;gap:11px;margin-bottom:18px}
.lav{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--lea),var(--lea2));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 0 3px rgba(244,114,182,.2)}
.lbub{background:rgba(244,114,182,.1);border:1px solid rgba(244,114,182,.2);border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:14px;line-height:1.6;max-width:calc(100% - 58px)}
.lnm{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--lea);margin-bottom:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
@media(max-width:440px){.opts{grid-template-columns:1fr}}
.opt{padding:11px 14px;background:var(--s2);border:2px solid var(--b);border-radius:10px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#f0f4ff;text-align:left;display:flex;align-items:center;gap:8px;transition:all .17s}
.opt:hover:not(:disabled){border-color:var(--ac);background:rgba(124,106,247,.1);transform:translateX(3px)}
.opt.ok{border-color:var(--gn);background:rgba(34,197,94,.1)}
.opt.ko{border-color:var(--rd);background:rgba(239,68,68,.1)}
.opt.pg{border-color:var(--go);background:rgba(245,200,66,.07)}
.opt:disabled{cursor:default}
.ol{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.notion{margin-top:12px;padding:12px 14px;background:rgba(124,106,247,.07);border:1px solid rgba(124,106,247,.2);border-radius:10px;font-size:13px;line-height:1.6}
.nlbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ac);margin-bottom:4px}
.cours{margin-top:12px;background:rgba(245,200,66,.04);border:1px solid rgba(245,200,66,.2);border-radius:10px;overflow:hidden}
.cours-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:rgba(245,200,66,.07)}
.cours-ttl{font-size:12px;font-weight:800;color:var(--go)}
.cours-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cours-step{font-size:12px;line-height:1.6;padding:7px 10px;background:rgba(255,255,255,.03);border-radius:7px;border-left:3px solid var(--go)}
.cours-note{font-size:11px;color:#fde68a;font-style:italic;padding:7px 10px;background:rgba(245,200,66,.06);border-radius:7px}
.remed{margin-top:12px;background:rgba(34,197,94,.04);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:12px 14px}
.remed-lbl{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--gn);margin-bottom:8px}
.remed-q{font-size:13px;font-weight:700;margin-bottom:10px;line-height:1.4}
.pbar{display:flex;gap:3px;margin-bottom:4px}
.ps{flex:1;height:5px;border-radius:3px;background:var(--s2);transition:background .4s}
.ps.ok{background:var(--gn)}.ps.ko{background:var(--rd)}.ps.cur{background:var(--go)}
.plbl{font-size:10px;color:#6b7280;margin-bottom:16px;display:flex;justify-content:space-between}
.qtxt{font-family:'Syne',sans-serif;font-size:clamp(15px,3.5vw,20px);font-weight:700;line-height:1.4;margin-bottom:18px}
.qtype{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:10px}
.timer-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.timer-num{font-size:16px;font-weight:800;font-family:monospace;min-width:28px;text-align:center}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-c{background:var(--s);border:1px solid var(--b);border-radius:11px;padding:12px;text-align:center}
.stat-n{font-family:'Syne',sans-serif;font-size:26px;font-weight:800}
.stat-l{font-size:10px;color:#6b7280;margin-top:3px}
.br{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bl{font-size:11px;font-weight:700;width:105px;flex-shrink:0}
.bt{flex:1;height:8px;background:var(--s2);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .8s}
.bp{font-size:11px;color:#6b7280;width:32px;text-align:right}
.ar{background:var(--s2);border-radius:10px;padding:11px 13px;border-left:4px solid transparent;display:flex;gap:10px;margin-bottom:7px}
.ar.ok{border-color:var(--gn)}.ar.ko{border-color:var(--rd)}
.aq{font-size:12px;font-weight:700;margin-bottom:2px}
.an{font-size:11px;color:#a5b4fc;margin-top:3px;line-height:1.5}
.codecard{background:rgba(244,114,182,.08);border:2px solid rgba(244,114,182,.3);border-radius:14px;padding:14px 16px;margin-bottom:14px;text-align:center}
.codeval{font-family:monospace;font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:4px;background:var(--s2);border-radius:9px;padding:10px 18px;display:inline-block;margin:8px 0}
.tag{display:inline-flex;padding:3px 8px;border-radius:100px;font-size:11px;font-weight:700}
.tg{background:rgba(34,197,94,.14);color:#4ade80}
.tr{background:rgba(239,68,68,.14);color:#f87171}
.to{background:rgba(245,200,66,.14);color:var(--go)}
.nb{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:100px;font-family:'Syne',sans-serif;font-size:15px;font-weight:800}
.sec{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:10px}
.div{height:1px;background:var(--b);margin:14px 0}
.flex{display:flex;gap:7px;flex-wrap:wrap}
.pc{background:linear-gradient(135deg,rgba(244,114,182,.08),rgba(124,106,247,.08));border:1px solid rgba(244,114,182,.18);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.pclbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--lea);margin-bottom:6px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,24,39,.97);border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 12px;cursor:pointer;border:none;background:none;color:#6b7280;font-size:10px;font-family:'Nunito',sans-serif;font-weight:700}
.ni.on{color:var(--lea)}
.inp{width:100%;padding:10px 13px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:#f0f4ff;font-family:'Nunito',sans-serif;font-size:15px;outline:none;margin-top:6px}
.inp:focus{border-color:var(--lea)}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.av{font-size:26px;cursor:pointer;border-radius:8px;padding:5px;border:2px solid transparent}
.av:hover{background:var(--s2)}.av.sel{border-color:var(--lea);background:rgba(244,114,182,.1)}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.su{animation:su .35s ease both}
</style>
</head>

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};

const buildDiag=used=>{
  const pick=(t,ch)=>shuf(BANK.filter(q=>q.t===t&&q.ch===ch&&!used.includes(q.id)))[0]||null;
  const au=[],po=[];
  CHAP.forEach((ch,i)=>{
    const a=pick("auto",ch);if(a)au.push(a);
    const t2=i%2===0?"pont":"transfert";
    const b=pick(t2,ch)||pick(t2==="pont"?"transfert":"pont",ch);
    if(b)po.push(b);
  });
  return [...au,...po].slice(0,18);
};

const buildExam=(prof,used)=>{
  const {as,ps,ts,fai}=prof;
  const w={auto:3,pont:3,tr:3};
  if(as<0.5)w.auto=4;if(ps<0.5)w.pont=4;if(ts<0.5)w.tr=4;
  const tot=w.auto+w.pont+w.tr;
  const nA=Math.round(w.auto/tot*9),nP=Math.round(w.pont/tot*9),nT=9-nA-nP;
  const pool=(type,n)=>{
    let qs=BANK.filter(q=>q.t===type&&!used.includes(q.id));
    return shuf([...qs.filter(q=>fai.includes(q.ch)),...qs.filter(q=>!fai.includes(q.ch))]).slice(0,n);
  };
  return shuf([...pool("auto",nA),...pool("pont",nP),...pool("transfert",nT)]);
};

const calcProf=res=>{
  const n=res.length,ok=res.filter(r=>r.ok).length;
  const avg=Math.round(res.reduce((s,r)=>s+r.time,0)/n);
  const sc=t=>{const b=res.filter(r=>r.type===t);return b.length?b.filter(r=>r.ok).length/b.length:0;};
  const as=sc("auto"),ps=sc("pont"),ts=sc("transfert");
  const cm={};res.forEach(r=>{if(!cm[r.ch])cm[r.ch]={ok:0,n:0};cm[r.ch].n++;if(r.ok)cm[r.ch].ok++;});
  const fort=Object.entries(cm).filter(([,v])=>v.ok/v.n>=0.5).map(([k])=>k);
  const fai=Object.entries(cm).filter(([,v])=>v.ok/v.n<0.5).map(([k])=>k);
  let niv="explorateur";
  if(ok/n>=0.83&&avg<30)niv="expert";else if(ok/n>=0.6)niv="challenger";
  let mx=null;
  if(as>=0.8&&ts<0.5)mx="rt";else if(as<0.5&&avg>50)mx="lj";else if(as>=0.7&&ps<0.5)mx="cs";
  return{score:ok,total:n,pct:Math.round(ok/n*100),avg,niv,mx,as,ps,ts,
    fq:res.filter(r=>r.ok&&r.time<20).length,pc:res.filter(r=>r.piege).length,fort,fai};
};

const encP=p=>{
  try{
    const m={s:p.score,t:p.total,n:p.niv[0],a:Math.round(p.as*10),po:Math.round(p.ps*10),r:Math.round(p.ts*10),f:p.fai.join(","),k:p.fort.join(","),v:p.avg};
    const b=btoa(unescape(encodeURIComponent(JSON.stringify(m))));
    const h=b.replace(/[^A-Z0-9]/gi,"").toUpperCase().slice(0,6);
    try{localStorage.setItem("lc_"+h,b);}catch(e){}
    return"LEA-"+h;
  }catch(e){return null;}
};
const decP=code=>{
  try{
    const h=code.replace("LEA-","").toUpperCase().trim();
    const b=localStorage.getItem("lc_"+h);if(!b)return null;
    const m=JSON.parse(decodeURIComponent(escape(atob(b))));
    const nv={e:"explorateur",c:"challenger",x:"expert"};
    return{score:m.s,total:m.t,pct:Math.round(m.s/m.t*100),niv:nv[m.n]||"explorateur",
      as:m.a/10,ps:m.po/10,ts:m.r/10,fai:m.f?m.f.split(",").filter(Boolean):[],
      fort:m.k?m.k.split(",").filter(Boolean):[],avg:m.v,mx:null,fq:0,pc:0};
  }catch(e){return null;}
};

function doAnswer(idx){
  if(S.chosen!==null)return;
  clearInterval(timer);
  const elapsed=Math.round((Date.now()-S.qStart)/1000);
  const q=S.qs[S.qi];
  const ok=idx===q.a,isPiege=idx===q.p;
  const newAns=[...S.ans,{qid:q.id,type:q.t,ch:q.ch,ok,time:elapsed,piege:isPiege,idx,q}];
  let showR=false,showC=false;
  if(!ok){
    const ec={...S.errCnt,[q.ch]:(S.errCnt[q.ch]||0)+1};
    setState({errCnt:ec});
    showC=true;
    if((S.errCnt[q.ch]||0)>=1){showR=true;leaSay(rnd(MSGS.ko_cours),300);}
    else leaSay(idx===-1?rnd(MSGS.skip):isPiege?rnd(MSGS.ko_piege):rnd(MSGS.ko),300);
  }else{
    leaSay(elapsed<20?rnd(MSGS.ok_fast):elapsed>50?rnd(MSGS.ok_slow):"Bien ! T'as trouvé 👍",300);
  }
  setState({chosen:idx,showN:true,showC,showR,ans:newAns});
}

function nextQ(){
  if(S.showR&&!S.rDone)return;
  const ni=S.qi+1;
  if(ni>=S.qs.length){finishQuiz();return;}
  const tl=SEC[S.qs[ni]?.t]||60;
  setState({qi:ni,chosen:null,showN:false,showC:false,cOpen:false,
    showR:false,rDone:false,rChosen:null,tLeft:tl,tTotal:tl,qStart:Date.now()});
  if(S.isDiag&&ni===9)leaSay(rnd(MSGS.phase2),200);
  else{const t=S.qs[ni]?.t;leaSay(rnd(t==="pont"?MSGS.next_pont:t==="transfert"?MSGS.next_tr:MSGS.next_auto),200);}
  setTimeout(startTimer,400);
}

function finishQuiz(){
  const p=calcProf(S.ans);
  if(S.isDiag){
    sv("ld",p);
    const code=encP(p);
    if(code)sv("lpcode",code);
    let msg=rnd(p.pct>=83?MSGS.top:p.pct>=60?MSGS.bon:p.pct>=33?MSGS.moyen:MSGS.faible);
    if(p.mx)msg+=MSGS[p.mx];
    setState({diagProf:p,pcode:code,screen:"results"});
    leaSay(msg,500);
  }else{
    const e={id:Date.now(),date:new Date().toLocaleDateString("fr-FR"),score:p.score,total:p.total,pct:p.pct,
      ans:S.ans.map(a=>({ch:a.ch,ok:a.ok,notion:a.q.n,qtext:a.q.q}))};
    const nh=[e,...S.hist].slice(0,100);
    sv("lh",nh);
    setState({hist:nh,screen:"results"});
    leaSay(rnd(p.pct>=89?MSGS.fin_top:p.pct>=67?MSGS.fin_bon:p.pct>=44?MSGS.fin_moy:MSGS.fin_fai),400);
  }
}

function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class")el.className=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else el.setAttribute(k,v);
  });
  children.flat().forEach(c=>{
    if(c==null||c===false)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
  });
  return el;
}

function TimerEl(){
  const p=S.tLeft/S.tTotal;
  const col=p>.5?"#7c6af7":p>.25?"#f5c842":"#ef4444";
  const r=18,c=2*Math.PI*r;
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("width","44");svg.setAttribute("height","44");svg.setAttribute("viewBox","0 0 44 44");
  svg.style.transform="rotate(-90deg)";
  const bg=document.createElementNS(ns,"circle");
  bg.setAttribute("cx","22");bg.setAttribute("cy","22");bg.setAttribute("r",r);
  bg.setAttribute("fill","none");bg.setAttribute("stroke","rgba(255,255,255,.07)");bg.setAttribute("stroke-width","3");
  const fg=document.createElementNS(ns,"circle");
  fg.setAttribute("cx","22");fg.setAttribute("cy","22");fg.setAttribute("r",r);
  fg.setAttribute("fill","none");fg.setAttribute("stroke",col);fg.setAttribute("stroke-width","3");
  fg.setAttribute("stroke-dasharray",c);fg.setAttribute("stroke-dashoffset",c*(1-p));
  fg.setAttribute("stroke-linecap","round");
  fg.style.transition="stroke-dashoffset .8s linear,stroke .5s";
  svg.appendChild(bg);svg.appendChild(fg);
  const wrap=h("div",{style:{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center"}});
  wrap.appendChild(svg);
  const num=h("span",{id:"tnum",style:{position:"absolute",fontFamily:"monospace",fontSize:"12px",color:col}},S.tLeft);
  wrap.appendChild(num);
  return wrap;
}

}

function renderSetup(){
  const AVS=["🦁","🐯","🦊","🐉","🚀","⚡","🔥","🌟","💎","🎯","🏄","🌴"];
  if(!S._setupName)S._setupName="";
  if(!S._setupAv)S._setupAv="🦁";
  const wrap=h("div",{class:"app",style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}});
  const card=h("div",{style:{maxWidth:"360px",width:"100%",background:"var(--s)",border:"1px solid var(--b)",borderRadius:"18px",padding:"26px 20px"}});
  card.appendChild(h("div",{style:{fontSize:"44px",textAlign:"center",marginBottom:"9px"}},"🌺"));
  card.appendChild(h("div",{style:{fontFamily:"Syne,sans-serif",fontSize:"22px",fontWeight:"800",textAlign:"center",marginBottom:"5px"}},"Brevet",h("span",{style:{color:"var(--lea)"}},"Léa")));
  card.appendChild(h("div",{style:{color:"#6b7280",fontSize:"12px",textAlign:"center",marginBottom:"20px"}},"Léa va d'abord apprendre à te connaître !"));
  card.appendChild(h("div",{style:{marginBottom:"14px"}},h("label",{style:{fontSize:"10px",fontWeight:"800",textTransform:"uppercase",letterSpacing:"1px",color:"#6b7280"}},"Ton prénom"),h("input",{class:"inp",placeholder:"ex: Nawal",maxlength:"20",value:S._setupName,oninput:e=>S._setupName=e.target.value})));
  const avlbl=h("label",{style:{fontSize:"10px",fontWeight:"800",textTransform:"uppercase",letterSpacing:"1px",color:"#6b7280"}},"Ton avatar");
  const avs=h("div",{class:"avs"});
  AVS.forEach(a=>{
    const sp=h("span",{class:"av"+(S._setupAv===a?" sel":""),onclick:()=>{S._setupAv=a;render();}},a);
    avs.appendChild(sp);
  });
  card.appendChild(avlbl);card.appendChild(avs);
  card.appendChild(h("div",{style:{height:"18px"}}));
  const btn=h("button",{class:"btn blea",onclick:()=>{
    if(!S._setupName.trim())return;
    const p={name:S._setupName.trim(),avatar:S._setupAv,since:new Date().toLocaleDateString("fr-FR")};
    sv("lp",p);setState({profile:p,screen:"main"});
  }},"Rencontrer Léa 🌺");
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  let el;
  if(S.screen==="loading")el=h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0a0e1a"}},h("div",{style:{textAlign:"center"}},h("div",{style:{fontSize:"48px",marginBottom:"10px"}},"🌺"),h("div",{style:{color:"#6b7280",fontSize:"13px"}},"Chargement de Léa...")));
  else if(S.screen==="setup")el=renderSetup();
  else if(S.screen==="quiz")el=renderQuiz();
  else if(S.screen==="results")el=renderResults();
  else el=renderMain();
  app.appendChild(el);
}

// ═══════════════════════════
// INIT
// ═══════════════════════════
(function init(){
  const p=ld("lp",null),d=ld("ld",null),h2=ld("lh",[]),pc=ld("lpcode",null);
  S.profile=p;S.diagProf=d;S.hist=h2;S.pcode=pc;
  if(d&&pc){S.pcode=pc;}
  S.screen=p?"main":"setup";
  render();
})();
</script>
