// ══════════════════════════════════════════════════════════════
// DIAGNOSTIC — 18 questions garanties : 1 auto + 1 pont/transfert par chapitre
// ══════════════════════════════════════════════════════════════
const buildDiag = (usedIds=[]) => {
  const pick = (type, ch) => shuffle(BANK.filter(q=>q.type===type&&q.ch===ch&&!usedIds.includes(q.id)))[0]||null;
  const autos=[], ponts=[];
  CHAPITRES.forEach((ch,i)=>{
    const a = pick("auto",ch); if(a) autos.push(a);
    const t2 = i%2===0?"pont":"transfert";
    const b = pick(t2,ch)||pick(t2==="pont"?"transfert":"pont",ch);
    if(b) ponts.push(b);
  });
  return [...autos,...ponts].slice(0,DIAG_SIZE);
};

// ══════════════════════════════════════════════════════════════
// ÉPREUVE ADAPTATIVE — pondérée selon profil
// ══════════════════════════════════════════════════════════════
const buildExam = (profil, usedIds=[]) => {
  const {autoScore,pontScore,transfertScore,faibles} = profil;
  const w = { auto:3, pont:3, transfert:3 };
  if(autoScore<0.5) w.auto=4; if(pontScore<0.5) w.pont=4; if(transfertScore<0.5) w.transfert=4;
  const tot=w.auto+w.pont+w.transfert;
  const nA=Math.round(w.auto/tot*EXAM_SIZE), nP=Math.round(w.pont/tot*EXAM_SIZE), nT=EXAM_SIZE-nA-nP;
  const pool=(type,n)=>{
    let qs=BANK.filter(q=>q.type===type&&!usedIds.includes(q.id));
    const first=qs.filter(q=>faibles.includes(q.ch));
    return shuffle([...first,...qs.filter(q=>!faibles.includes(q.ch))]).slice(0,n);
  };
  return shuffle([...pool("auto",nA),...pool("pont",nP),...pool("transfert",nT)]);
};

// ══════════════════════════════════════════════════════════════
// CALCUL PROFIL
// ══════════════════════════════════════════════════════════════
const calcProfile = results => {
  const n=results.length, correct=results.filter(r=>r.correct).length;
  const avgTime=Math.round(results.reduce((s,r)=>s+r.time,0)/n);
  const sc = t=>{ const b=results.filter(r=>r.type===t); return b.length?b.filter(r=>r.correct).length/b.length:0; };
  const autoScore=sc("auto"),pontScore=sc("pont"),transfertScore=sc("transfert");
  const cm={};
  results.forEach(r=>{ if(!cm[r.ch])cm[r.ch]={ok:0,n:0}; cm[r.ch].n++; if(r.correct)cm[r.ch].ok++; });
  const forts=Object.entries(cm).filter(([,v])=>v.ok/v.n>=0.5).map(([k])=>k);
  const faibles=Object.entries(cm).filter(([,v])=>v.ok/v.n<0.5).map(([k])=>k);
  let niveau="explorateur";
  if(correct/n>=0.83&&avgTime<30) niveau="expert";
  else if(correct/n>=0.6) niveau="challenger";
  let profilMixte=null;
  if(autoScore>=0.8&&transfertScore<0.5) profilMixte="rapide_transfert";
  else if(autoScore<0.5&&avgTime>50) profilMixte="lent_juste";
  else if(autoScore>=0.7&&pontScore<0.5) profilMixte="calcul_sens";
  return {score:correct,total:n,pct:Math.round(correct/n*100),avgTime,niveau,profilMixte,
    autoScore,pontScore,transfertScore,fastQ:results.filter(r=>r.correct&&r.time<20).length,
    piegeCount:results.filter(r=>r.piege).length,forts,faibles};
};

const load = (k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };

// ══════════════════════════════════════════════════════════════
// CODE PROFIL — encode/decode pour portabilité
// ══════════════════════════════════════════════════════════════
const encodeProfile = p => {
  try{
    const m={s:p.score,t:p.total,n:p.niveau[0],a:Math.round(p.autoScore*10),
      po:Math.round(p.pontScore*10),r:Math.round(p.transfertScore*10),
      f:p.faibles.join(","),k:p.forts.join(","),avg:p.avgTime};
    const b=btoa(unescape(encodeURIComponent(JSON.stringify(m))));
    const hash=b.replace(/[^A-Z0-9]/gi,"").toUpperCase().slice(0,6);
    try{localStorage.setItem("lea_c_"+hash,b);}catch(e){}
    return "LEA-"+hash;
  }catch(e){return null;}
};
const decodeProfile = code => {
  try{
    const hash=code.replace("LEA-","").toUpperCase().trim();
    const b=localStorage.getItem("lea_c_"+hash);
    if(!b)return null;
    const m=JSON.parse(decodeURIComponent(escape(atob(b))));
    const nv={e:"explorateur",c:"challenger",x:"expert"};
    return{score:m.s,total:m.t,pct:Math.round(m.s/m.t*100),niveau:nv[m.n]||"explorateur",
      autoScore:m.a/10,pontScore:m.po/10,transfertScore:m.r/10,
      faibles:m.f?m.f.split(",").filter(Boolean):[],forts:m.k?m.k.split(",").filter(Boolean):[],
      avgTime:m.avg,profilMixte:null,fastQ:0,piegeCount:0};
  }catch(e){return null;}
};

.ae{font-size:11px;color:#fca5a5;margin-top:2px;font-style:italic}
/* CODE PROFIL */
.codecard{background:linear-gradient(135deg,rgba(244,114,182,.1),rgba(251,146,60,.07));
  border:2px solid rgba(244,114,182,.3);border-radius:var(--r);padding:16px 18px;
  margin-bottom:16px;text-align:center}
.codelbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--lea);margin-bottom:8px}
.codeval{font-family:var(--fm);font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:4px;
  color:var(--t);background:var(--s2);border-radius:9px;padding:10px 18px;
  display:inline-block;margin-bottom:8px}
.codesub{font-size:11px;color:var(--mu);line-height:1.6;margin-bottom:10px}
/* TAGS */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:100px;font-size:11px;font-weight:700}
.tg{background:rgba(34,197,94,.14);color:#4ade80}
.tr{background:rgba(239,68,68,.14);color:#f87171}
.to{background:rgba(245,200,66,.14);color:var(--go)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 22px;border-radius:10px;border:none;cursor:pointer;
  font-family:var(--fb);font-size:14px;font-weight:800;transition:all .2s}
.blea{background:linear-gradient(135deg,var(--lea),var(--lea2));color:white;width:100%}
.blea:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(244,114,182,.28)}
.bgh{background:var(--s2);color:var(--t);border:1px solid var(--b)}
.bgh:hover{background:var(--s)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
/* NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,24,39,.95);
  backdrop-filter:blur(14px);border-top:1px solid var(--b);
  display:flex;justify-content:space-around;padding:7px 0 max(7px,env(safe-area-inset-bottom));z-index:100}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 12px;
  cursor:pointer;border:none;background:none;color:var(--mu);
  font-size:10px;font-family:var(--fb);font-weight:700;transition:color .2s}
.ni.on{color:var(--lea)}
.ni svg{width:20px;height:20px}
/* SETUP */
.setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.sc2{max-width:380px;width:100%;background:var(--s);border:1px solid var(--b);
  border-radius:20px;padding:28px 22px;animation:su .5s ease both}
.inp{width:100%;padding:11px 14px;background:var(--s2);border:1px solid var(--b);
  border-radius:10px;color:var(--t);font-family:var(--fb);font-size:15px;
  outline:none;transition:border-color .2s;margin-top:6px}
.inp:focus{border-color:var(--lea)}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.av{font-size:27px;cursor:pointer;border-radius:8px;padding:5px;border:2px solid transparent;transition:all .2s}
.av:hover{background:var(--s2)}.av.sel{border-color:var(--lea);background:rgba(244,114,182,.1)}
/* NIV */
.nb{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;
  border-radius:100px;font-family:var(--fd);font-size:15px;font-weight:800}
/* MISC */
.sec{font-family:var(--fd);font-size:16px;font-weight:800;margin-bottom:11px}
.div{height:1px;background:var(--b);margin:16px 0}
.flex{display:flex;gap:7px;flex-wrap:wrap}
.pc{background:linear-gradient(135deg,rgba(244,114,182,.08),rgba(124,106,247,.08));
  border:1px solid rgba(244,114,182,.18);border-radius:var(--r);padding:16px 20px;margin-bottom:16px}
.pclbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--lea);margin-bottom:7px}
.pctxt{font-size:13px;line-height:1.7}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--s2);border-radius:3px}
`;

// COMPOSANTS
// ══════════════════════════════════════════════════════════════
const LeaBubble = ({text,typing=false}) => (
  <div className="lrow">
    <div className="lav">🌺</div>
    <div className="lbub">
      <div className="lnm">Léa · Saint-Denis, La Réunion</div>
      {typing ? <div className="ty"><span/><span/><span/></div> : <div>{text}</div>}
    </div>
  </div>
);

const TimerRing = ({left,total}) => {
  const r=20,c=2*Math.PI*r,p=left/total;
  const col=p>.5?"#7c6af7":p>.25?"#f5c842":"#ef4444";
  return (
    <div style={{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
      <svg width="50" height="50" viewBox="0 0 50 50" style={{transform:"rotate(-90deg)"}}>
        <circle cx="25" cy="25" r={r} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="3"/>
        <circle cx="25" cy="25" r={r} fill="none" stroke={col} strokeWidth="3"
          strokeDasharray={c} strokeDashoffset={c*(1-p)} strokeLinecap="round"
          style={{transition:"stroke-dashoffset .8s linear,stroke .5s"}}/>
      </svg>
      <span style={{position:"absolute",fontFamily:"var(--fm)",fontSize:"12px",color:col}}>{left}</span>
    </div>
  );
};

// ══════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════
  const [screen,setScreen]   = useState("loading");
  const [tab,setTab]         = useState("home");
  const [profile,setProfile] = useState(null);
  const [diagProfile,setDiagProfile] = useState(null);
  const [history,setHistory] = useState([]);
  const [profileCode,setProfileCode] = useState(null);
  const [importInput,setImportInput] = useState("");
  const [importError,setImportError] = useState("");

  // Quiz
  const [questions,setQuestions] = useState([]);
  const [qIdx,setQIdx]           = useState(0);
  const [answers,setAnswers]     = useState([]);
  const [chosen,setChosen]       = useState(null);
  const [timeLeft,setTimeLeft]   = useState(60);
  const [showNotion,setShowNotion] = useState(false);
  const [showCours,setShowCours]  = useState(false);
  const [coursOpen,setCoursOpen]  = useState(false);
  const [showRemed,setShowRemed]  = useState(false);
  const [remedDone,setRemedDone]  = useState(false);
  const [remedChosen,setRemedChosen] = useState(null);
  const [leaMsg,setLeaMsg]       = useState("");
  const [leaTyping,setLeaTyping] = useState(false);
  const [qStart,setQStart]       = useState(Date.now());
  const [isDiag,setIsDiag]       = useState(true);
  const [usedIds,setUsedIds]     = useState([]);
  // Compteur d'erreurs par chapitre pour déclencher cours
  const [errCount,setErrCount]   = useState({});

  const timerRef = useRef(null);

  useEffect(()=>{
    const p=load("lp",null), d=load("ld",null),
          h=load("lh",[]), pc=load("lpcode",null);
    setProfile(p); setDiagProfile(d); setHistory(h);
    if(pc) setProfileCode(pc);
    setScreen(p?"main":"setup");
  },[]);

  useEffect(()=>{
    if(screen!=="quiz"||chosen!==null) return;
    timerRef.current=setInterval(()=>{
      setTimeLeft(t=>{ if(t<=1){clearInterval(timerRef.current);handleAnswer(-1);return 0;} return t-1; });
    },1000);
    return()=>clearInterval(timerRef.current);
  },[screen,qIdx,chosen]);

  const leaSay=useCallback((msg,delay=350)=>{
    setLeaTyping(true);
    setTimeout(()=>{setLeaTyping(false);setLeaMsg(msg);},delay+Math.min(msg.length*14,1100));
  },[]);

  const launchQuiz=useCallback((qs,diag=false)=>{
    setQuestions(qs);setQIdx(0);setAnswers([]);
    setChosen(null);setShowNotion(false);setShowCours(false);setCoursOpen(false);
    setShowRemed(false);setRemedDone(false);setRemedChosen(null);
    setTimeLeft(SECONDS[qs[0]?.type]||60);setQStart(Date.now());setIsDiag(diag);
    setScreen("quiz");
  },[]);

  const startDiag=()=>{
    const qs=buildDiag(usedIds);
    setUsedIds(prev=>[...prev,...qs.map(q=>q.id)]);
    launchQuiz(qs,true);
    leaSay(rand(LEA.intro),200);
  };

  const startExam=()=>{
    if(!diagProfile) return;
    const qs=buildExam(diagProfile,usedIds);
    setUsedIds(prev=>[...prev,...qs.map(q=>q.id)]);
    launchQuiz(qs,false);
    leaSay(rand(LEA.exam_start),200);
  };

  const handleAnswer=useCallback((idx)=>{
    if(chosen!==null) return;
    clearInterval(timerRef.current);
    const elapsed=Math.round((Date.now()-qStart)/1000);
    setChosen(idx);
    setShowNotion(true);
    const q=questions[qIdx];
    const correct=idx===q.ans, isPiege=idx===q.piege;
    setAnswers(prev=>[...prev,{qid:q.id,type:q.type,ch:q.ch,correct,time:elapsed,piege:isPiege,chosenIdx:idx,q}]);

    if(!correct){
      // Incrémenter compteur d'erreurs pour ce chapitre
      const newCount={...errCount,[q.ch]:(errCount[q.ch]||0)+1};
      setErrCount(newCount);
      // Afficher cours si 1ère erreur sur ce chapitre, remédiation si 2ème+
      if((errCount[q.ch]||0)>=1){
        setShowCours(true);
        setShowRemed(true);
        leaSay(rand(LEA.wrong_cours),300);
      } else {
        setShowCours(true);
        leaSay(idx===-1?rand(LEA.skip):isPiege?rand(LEA.wrong_piege):rand(LEA.wrong_normal),300);
      }
    } else {
      let msg;
      if(elapsed<20) msg=rand(LEA.correct_fast);
      else if(elapsed>50) msg=rand(LEA.correct_slow);
      else msg="Bien ! T'as trouvé 👍";
      leaSay(msg,300);
    }
  },[chosen,questions,qIdx,qStart,leaSay,errCount]);

  const nextQ=async()=>{
    if(showRemed&&!remedDone) return; // bloquer si remédiation pas faite
    if(qIdx+1>=questions.length){ await finishQuiz(); }
    else{
      const ni=qIdx+1;
      setQIdx(ni);setChosen(null);setShowNotion(false);
      setShowCours(false);setCoursOpen(false);
      setShowRemed(false);setRemedDone(false);setRemedChosen(null);
      setTimeLeft(SECONDS[questions[ni]?.type]||60);setQStart(Date.now());
      if(isDiag&&ni===9) leaSay(rand(LEA.phase2),200);
      else { const t=questions[ni]?.type; leaSay(rand(t==="pont"?LEA.next_pont:t==="transfert"?LEA.next_transf:LEA.next_auto),200); }
    }
  };

  const finishQuiz=async()=>{
    const p=calcProfile(answers);
    if(isDiag){
      setDiagProfile(p); save("ld",p);
      const code=encodeProfile(p);
      if(code){setProfileCode(code);save("lpcode",code);}
      let msg=rand(p.pct>=83?LEA.profil_top:p.pct>=60?LEA.profil_bon:p.pct>=33?LEA.profil_moyen:LEA.profil_faible);
      if(p.profilMixte==="rapide_transfert") msg+=LEA.profil_rapide_transfert;
      else if(p.profilMixte==="lent_juste") msg+=LEA.profil_lent_juste;
      else if(p.profilMixte==="calcul_sens") msg+=LEA.profil_calcul_sens;
      leaSay(msg,500);
    } else {
      const entry={id:Date.now(),date:new Date().toLocaleDateString("fr-FR"),
        score:p.score,total:p.total,pct:p.pct,
        answers:answers.map(a=>({qid:a.qid,type:a.type,ch:a.ch,correct:a.correct,
          notion:a.q.notion,qtext:a.q.q,chosenIdx:a.chosenIdx,ans:a.q.ans}))};
      const nh=[entry,...history].slice(0,100);
      setHistory(nh);save("lh",nh);
      leaSay(rand(p.pct>=89?LEA.exam_end_top:p.pct>=67?LEA.exam_end_bon:p.pct>=44?LEA.exam_end_moyen:LEA.exam_end_faible),400);
    }
    setScreen("results");
  };

  const setupProfile=p=>{setProfile(p);save("lp",p);setScreen("main");};
  const resetDiag=()=>{setDiagProfile(null);save("ld",null);setUsedIds([]);setErrCount({});};

  const mastery=()=>{
    const m={};CHAPITRES.forEach(k=>m[k]={ok:0,n:0});
    history.forEach(e=>e.answers?.forEach(a=>{if(m[a.ch]){m[a.ch].n++;if(a.correct)m[a.ch].ok++;}}));
    return m;
  };
  const NIV={
    explorateur:{emoji:"🥉",label:"Explorateur",color:"#4CAF50",bg:"rgba(76,175,80,.1)"},
    challenger:{emoji:"🥈",label:"Challenger",color:"#2196F3",bg:"rgba(33,150,243,.1)"},
    expert:{emoji:"🥇",label:"Expert Brevet",color:"#FF9800",bg:"rgba(255,152,0,.1)"},
  };

  // ── LOADING ──
  if(screen==="loading") return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0a0e1a"}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:46,marginBottom:9}}>🌺</div>
        <div style={{fontFamily:"sans-serif",color:"#6b7280",fontSize:12}}>Léa arrive...</div></div>
    </div>
  );

  if(screen==="setup") return <SetupScreen onDone={setupProfile}/>;

  // ── QUIZ ──
  if(screen==="quiz"){
    const q=questions[qIdx]; if(!q) return null;
    const letters=["A","B","C","D"];
    const total=SECONDS[q.type]||60;
    const cours=COURS[q.ch];
    const remedQ=cours?.remediation;

    return (
      <div className="app"><style>{css}</style>
        <div className="hdr">
          <button className="btn bgh" style={{padding:"6px 11px",fontSize:11}} onClick={()=>setScreen("main")}>← Quitter</button>
          <span style={{fontFamily:"var(--fm)",fontSize:11,color:"var(--mu)"}}>
            {isDiag?"Diagnostic":"Épreuve"} {qIdx+1}/{questions.length}
          </span>
          <TimerRing left={timeLeft} total={total}/>
        </div>
        <div className="wrap" style={{paddingTop:14}}>
          {/* Progress */}
          <div style={{marginBottom:5}}>
            <div className="pbar">
              {questions.map((_,i)=>{
                const r=answers[i];
                return <div key={i} className={`ps${i<qIdx?(r?.correct?" ok":" ko"):i===qIdx?" cur":""}`}
                  style={isDiag&&i===9?{marginLeft:"5px"}:{}}/>;
              })}
            </div>
            <div className="plbl">
              <span>{TYPE_LABEL[q.type]} · {CH_LABEL[q.ch]}</span>
              {isDiag&&<span style={{fontSize:9}}>{qIdx<9?"⚡ Phase 1 — Automatismes":"🎯 Phase 2 — Raisonnement"}</span>}
            </div>
          </div>

          {(leaMsg||leaTyping)&&<LeaBubble text={leaMsg} typing={leaTyping}/>}

          <div className="qcard">
            <div className="qmeta">
              <span className="qtype" style={{background:`${TYPE_COLOR[q.type]}18`,color:TYPE_COLOR[q.type]}}>{TYPE_LABEL[q.type]}</span>
              <span style={{fontFamily:"var(--fm)",fontSize:11,color:"var(--mu)"}}>Q{qIdx+1}</span>
            </div>
            <div className="qtxt">{q.q}</div>
            <div className="opts">
              {q.opts.map((opt,i)=>{
                let cl="opt";
                if(chosen!==null){if(i===q.ans)cl+=" ok";else if(i===chosen&&chosen!==q.ans)cl+=i===q.piege?" pg":" ko";}
                return <button key={i} className={cl} onClick={()=>handleAnswer(i)} disabled={chosen!==null}>
                  <span className="ol">{letters[i]}</span>{opt}</button>;
              })}
            </div>

            {/* NOTION FLASH */}
            {showNotion&&(
              <div className="notion">
                <div className="nlbl">📘 Notion clé</div>
                <div>{q.notion}</div>
                {chosen!==q.ans&&chosen!==-1&&q.erreur_type?.[chosen]&&<div className="ebox">💡 {q.erreur_type[chosen]}</div>}
              </div>
            )}

            {/* COURS PAS À PAS — si erreur */}
            {showCours&&cours&&(
              <div className="cours">
                <div className="cours-hdr" onClick={()=>setCoursOpen(o=>!o)}>
                  <span className="cours-ttl">📖 Cours — {cours.titre}</span>
                  <span style={{color:"var(--go)",fontSize:18}}>{coursOpen?"▲":"▼"}</span>
                </div>
                {coursOpen&&(
                  <div className="cours-body">
                    {cours.etapes.map((e,i)=>(
                      <div key={i} className={e.startsWith("📝")||e.startsWith("✏️")?"cours-note":"cours-step"}>{e}</div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* REMÉDIATION — si 2e erreur sur ce chapitre */}
            {showRemed&&remedQ&&!remedDone&&(
              <div className="remed">
                <div className="remed-lbl">💪 Question de remédiation — {CH_LABEL[q.ch]}</div>
                <div className="remed-q">{remedQ.q}</div>
                <div className="opts">
                  {remedQ.opts.map((opt,i)=>{
                    let cl="opt";
                    if(remedChosen!==null){if(i===remedQ.ans)cl+=" ok";else if(i===remedChosen)cl+=" ko";}
                    return <button key={i} className={cl}
                      disabled={remedChosen!==null}
                      onClick={()=>{
                        setRemedChosen(i);
                        if(i===remedQ.ans){setRemedDone(true);leaSay("Parfait ! T'as compris. On continue 🌺",200);}
                        else leaSay("Pas encore... relis le cours et réessaie 💪",200);
                      }}>
                      <span className="ol">{["A","B","C","D"][i]}</span>{opt}</button>;
                  })}
                </div>
                {remedChosen!==null&&remedChosen!==remedQ.ans&&(
                  <div style={{marginTop:8,fontSize:12,color:"#fca5a5"}}>📘 {remedQ.notion}</div>
                )}
                {remedDone&&<div style={{marginTop:8,fontSize:12,color:"#4ade80"}}>✅ {remedQ.notion}</div>}
              </div>
            )}

            {/* BOUTON SUIVANT */}
            {showNotion&&(
              <div style={{marginTop:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                {showCours&&!coursOpen&&(
                  <button className="btn bgh" style={{padding:"8px 12px",fontSize:11,width:"auto"}}
                    onClick={()=>setCoursOpen(true)}>📖 Voir le cours</button>
                )}
                <button className="btn" style={{background:"var(--lea)",color:"white",padding:"10px 18px",
                  fontSize:12,width:"auto",marginLeft:"auto",
                  opacity:(showRemed&&!remedDone)?0.4:1,cursor:(showRemed&&!remedDone)?"not-allowed":"pointer"}}
                  onClick={nextQ}
                  disabled={showRemed&&!remedDone}>
                  {showRemed&&!remedDone?"⏳ Fais la remédiation d'abord":qIdx+1>=questions.length?(isDiag?"Voir mon profil 🌺":"Résultats 🏁"):"Suivante →"}
                </button>
              </div>
            )}
            {chosen===null&&(
              <div style={{marginTop:11,textAlign:"center"}}>
                <button className="btn bgh" style={{padding:"7px 13px",fontSize:11}} onClick={()=>handleAnswer(-1)}>⏭ Je ne sais pas</button>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ── RESULTS ──
  if(screen==="results"){
    const p=calcProfile(answers);
    const sc=p.pct>=70?"#22c55e":p.pct>=45?"#f5c842":"#ef4444";
    const niv=NIV[p.niveau]||NIV.explorateur;
    return (
      <div className="app"><style>{css}</style>
        <div className="hdr">
          <div className="logo">Brevet<span>Léa</span></div>
          <button className="btn bgh" style={{padding:"6px 11px",fontSize:11}} onClick={()=>{setScreen("main");setTab("home");}}>Accueil</button>
        </div>
        <div className="wrap">
          <div style={{textAlign:"center",padding:"24px 0 18px",animation:"su .5s ease both"}}>
            <div style={{fontSize:52,marginBottom:7}}>{p.pct>=70?"🔥":p.pct>=45?"⭐":"📚"}</div>
            <div style={{fontFamily:"var(--fd)",fontSize:"clamp(44px,12vw,68px)",fontWeight:800,color:sc,lineHeight:1}}>{p.score}</div>
            <div style={{color:"var(--mu)",fontSize:13,marginTop:3}}>/ {p.total} point{p.total>1?"s":""} · {p.avgTime}s moyen</div>
          </div>

          <div className="pc">
            <div className="pclbl">🌺 Léa te dit</div>
            <div className="pctxt">{leaTyping?<div className="ty"><span/><span/><span/></div>:leaMsg||"..."}</div>
          </div>

          {isDiag&&(
            <>
              <div style={{textAlign:"center",marginBottom:16}}>
                <div style={{fontSize:11,color:"var(--mu)",marginBottom:7}}>Léa te recommande</div>
                <div className="nb" style={{background:niv.bg,color:niv.color,margin:"0 auto"}}>{niv.emoji} {niv.label}</div>
              </div>
              {profileCode&&(
                <div className="codecard">
                  <div className="codelbl">📋 Ton code profil — note-le !</div>
                  <div className="codeval">{profileCode}</div>
                  <div className="codesub">Si tu changes d'appareil ou de navigateur,<br/>colle ce code pour retrouver ton profil sans refaire le diagnostic.</div>
                  <button className="btn bgh" style={{padding:"7px 14px",fontSize:11,width:"auto"}}
                    onClick={()=>{ navigator.clipboard?.writeText(profileCode).then(()=>alert("Code copié ! 📋")).catch(()=>alert("Ton code : "+profileCode)); }}>
                    📋 Copier le code
                  </button>
                </div>
              )}
            </>
          )}

          <div className="g3">
            <div className="sc"><div className="sn" style={{color:p.fastQ>=2?"#22c55e":"#f5c842"}}>{p.fastQ}</div><div className="sl">Réponses rapides</div></div>
            <div className="sc"><div className="sn" style={{color:p.piegeCount>0?"#ef4444":"#22c55e"}}>{p.piegeCount}</div><div className="sl">Pièges tombés</div></div>
            <div className="sc"><div className="sn" style={{color:"var(--go)"}}>{p.avgTime}s</div><div className="sl">Temps moyen</div></div>
          </div>

          <div className="card" style={{marginBottom:14}}>
            <div className="sec" style={{fontSize:13}}>Par type de question</div>
            {[["autoScore","⚡ Automatisme","#22c55e"],["pontScore","🌉 Pont","#f59e0b"],["transfertScore","🎯 Transfert","#7c6af7"]].map(([k,l,c])=>(
              <div key={k} className="br">
                <span className="bl">{l}</span>
                <div className="bt"><div className="bf" style={{width:`${Math.round(p[k]*100)}%`,background:c}}/></div>
                <span className="bp">{Math.round(p[k]*100)}%</span>
              </div>
            ))}
          </div>

          {(p.forts.length>0||p.faibles.length>0)&&(
            <div className="card" style={{marginBottom:14}}>
              {p.forts.length>0&&<><div style={{fontSize:10,color:"var(--mu)",marginBottom:5}}>✅ Points forts</div>
                <div className="flex" style={{marginBottom:9}}>{p.forts.map(c=><span key={c} className="tag tg">{CH_LABEL[c]}</span>)}</div></>}
              {p.faibles.length>0&&<><div style={{fontSize:10,color:"var(--mu)",marginBottom:5}}>🔴 À renforcer</div>
                <div className="flex">{p.faibles.map(c=><span key={c} className="tag tr">{CH_LABEL[c]}</span>)}</div></>}
            </div>
          )}

          <div className="div"/>
          <div className="sec">Correction détaillée</div>
          {answers.map((r,i)=>(
            <div key={i} className={`ar ${r.correct?"ok":"ko"}`}>
              <div style={{fontSize:17,flexShrink:0}}>{r.correct?"✅":"❌"}</div>
              <div style={{flex:1}}>
                <div className="aq">{r.q.q}</div>
                <div style={{fontSize:10,color:"var(--mu)",marginTop:1}}>{TYPE_LABEL[r.type]} · {r.time}s{r.piege&&<span style={{color:"var(--go)",marginLeft:5}}>⚠️ Piège</span>}</div>
                <div className="an">📘 {r.q.notion}</div>
                {!r.correct&&COURS[r.ch]&&(
                  <div style={{fontSize:10,color:"#fde68a",marginTop:3}}>
                    📖 Cours à revoir : {COURS[r.ch].titre}
                  </div>
                )}
              </div>
            </div>
          ))}

          <div className="div"/>
          <div style={{display:"flex",gap:9,marginBottom:8}}>
            {isDiag
              ? <button className="btn blea" onClick={startExam}>⚡ Commencer les épreuves</button>
              : <><button className="btn blea" onClick={startExam}>🔄 Nouvelle épreuve</button>
                 <button className="btn bgh" style={{flex:"0 0 auto"}} onClick={()=>{setScreen("main");setTab("home");}}>🏠</button></>
            }
          </div>
        </div>
      </div>
    );
  }

  // ── MAIN TABS ──
  const m=mastery(), totalE=history.length;
  const avgS=totalE?Math.round(history.reduce((s,e)=>s+e.pct,0)/totalE):0;
  const bestS=totalE?Math.max(...history.map(e=>e.score)):0;

  return (
    <div className="app"><style>{css}</style>
      <div className="hdr">
        <div className="logo">Brevet<span>Léa</span></div>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          {profile&&<span style={{fontSize:11,color:"var(--mu)"}}>👋 {profile.name}</span>}
          <div style={{width:32,height:32,borderRadius:"50%",
            background:"linear-gradient(135deg,var(--lea),var(--lea2))",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,cursor:"pointer"}}
            onClick={()=>setTab("profil")}>{profile?.avatar||"🌺"}</div>
        </div>
      </div>

      {/* HOME */}
      {tab==="home"&&(
        <div className="wrap" style={{animation:"su .4s ease both"}}>
          <LeaBubble text={diagProfile
            ?`Ayo ${profile?.name} ! Ton diagnostic est fait. Niveau : ${NIV[diagProfile.niveau]?.label}. On attaque ?`
            :rand(LEA.intro)}/>
          {!diagProfile?(
            <div className="card" style={{marginBottom:16,borderColor:"rgba(244,114,182,.2)"}}>
              <div className="sec">Diagnostic Léa 🔍</div>
              <div style={{color:"var(--mu)",fontSize:12,lineHeight:1.8,marginBottom:14}}>
                <div>📍 <b>18 questions</b> — 2 phases · 9 chapitres couverts</div>
                <div>⚡ Phase 1 — automatismes · 🎯 Phase 2 — raisonnement</div>
                <div>📖 Cours pas à pas si notion non maîtrisée</div>
                <div>💪 Exercice de remédiation si besoin</div>
                <div>📋 Code profil généré pour ne pas recommencer</div>
              </div>
              <button className="btn blea" onClick={startDiag}>🌺 Faire le diagnostic</button>
              <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid var(--b)"}}>
                <div style={{fontSize:11,color:"var(--mu)",marginBottom:7,fontWeight:700}}>📋 Tu as déjà un code profil ?</div>
                <div style={{display:"flex",gap:7}}>
                  <input className="inp" style={{flex:1,marginTop:0,fontSize:12,padding:"8px 11px",
                    textTransform:"uppercase",letterSpacing:2,fontFamily:"var(--fm)"}}
                    placeholder="LEA-XXXXXX" value={importInput}
                    onChange={e=>{setImportInput(e.target.value.toUpperCase());setImportError("");}}
                    maxLength={10}/>
                  <button className="btn bgh" style={{padding:"8px 12px",fontSize:11,flexShrink:0}}
                    onClick={async()=>{
                      const p=decodeProfile(importInput);
                      if(p){setDiagProfile(p);save("ld",p);setImportError("");}
                      else setImportError("Code non reconnu.");
                    }}>Importer</button>
                </div>
                {importError&&<div style={{fontSize:10,color:"var(--rd)",marginTop:5}}>{importError}</div>}
              </div>
            </div>
          ):(
            <>
              <div className="card" style={{background:"linear-gradient(135deg,rgba(244,114,182,.09),rgba(124,106,247,.07))",borderColor:"rgba(244,114,182,.22)",marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:11}}>
                  <div>
                    <div style={{fontFamily:"var(--fd)",fontSize:17,fontWeight:800}}>{NIV[diagProfile.niveau]?.emoji} {NIV[diagProfile.niveau]?.label}</div>
                    <div style={{color:"var(--mu)",fontSize:11,marginTop:2}}>Diag : {diagProfile.score}/{diagProfile.total} · {diagProfile.avgTime}s moy</div>
                  </div>
                  <button className="btn blea" style={{width:"auto",padding:"11px 20px"}} onClick={startExam}>⚡ Épreuve avec Léa</button>
                </div>
              </div>
              {profileCode&&(
                <div style={{background:"var(--s2)",borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontFamily:"var(--fm)",fontSize:13,letterSpacing:2,color:"var(--lea)",fontWeight:800}}>{profileCode}</span>
                  <span style={{fontSize:11,color:"var(--mu)",flex:1}}>Ton code profil — note-le !</span>
                  <button className="btn bgh" style={{padding:"5px 10px",fontSize:10,width:"auto"}}
                    onClick={()=>{navigator.clipboard?.writeText(profileCode).then(()=>alert("Copié ! 📋")).catch(()=>alert(profileCode));}}>
                    📋
                  </button>
                </div>
              )}
              <button className="btn bgh" style={{width:"100%",fontSize:11,padding:"8px"}} onClick={async()=>await resetDiag()}>🔄 Refaire le diagnostic</button>
            </>
          )}
          {history.length>0&&(
            <>
              <div className="div"/>
              <div className="sec">Dernières épreuves</div>
              {history.slice(0,3).map(e=>(
                <div key={e.id} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 0",borderBottom:"1px solid var(--b)"}}>
                  <span style={{fontSize:18}}>{e.pct>=70?"🔥":e.pct>=45?"⭐":"📚"}</span>
                  <div style={{flex:1}}><div style={{fontWeight:700,fontSize:12}}>{e.score}/{e.total} points</div>
                    <div style={{fontSize:10,color:"var(--mu)"}}>{e.date}</div></div>
                  <span className={`tag ${e.pct>=70?"tg":e.pct>=45?"to":"tr"}`}>{e.pct}%</span>
                </div>
              ))}
            </>
          )}
        </div>
      )}

      {/* PROGRÈS */}
      {tab==="progres"&&(
        <div className="wrap" style={{animation:"su .4s ease both"}}>
          <div className="sec">Mes progrès</div>
          <div className="g3" style={{marginBottom:16}}>
            <div className="sc"><div className="sn" style={{color:"var(--lea)"}}>{totalE}</div><div className="sl">Épreuves</div></div>
            <div className="sc"><div className="sn" style={{color:"var(--go)"}}>{avgS}%</div><div className="sl">Moy. %</div></div>
            <div className="sc"><div className="sn" style={{color:"var(--gn)"}}>{bestS}</div><div className="sl">Meilleur /9</div></div>
          </div>
          <div className="sec">Maîtrise par chapitre</div>
          <div className="card" style={{marginBottom:16}}>
            {CHAPITRES.map(k=>{
              const v=m[k]||{ok:0,n:0},pct=v.n>0?Math.round(v.ok/v.n*100):0;
              const col=pct>=70?"#22c55e":pct>=40?"#f5c842":pct>0?"#ef4444":"var(--s2)";
              return <div key={k} className="br">
                <span className="bl" style={{fontSize:10}}>{CH_LABEL[k]}</span>
                <div className="bt"><div className="bf" style={{width:`${pct}%`,background:col}}/></div>
                <span className="bp">{v.n>0?`${pct}%`:"—"}</span>
              </div>;
            })}
          </div>
          {history.length>0&&(<>
            <div className="sec">Historique</div>
            <div className="card">
              {history.map(e=>(
                <div key={e.id} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 0",borderBottom:"1px solid var(--b)"}}>
                  <span style={{fontSize:16}}>{e.pct>=70?"🔥":e.pct>=45?"⭐":"📚"}</span>
                  <div style={{flex:1}}><div style={{fontWeight:700,fontSize:11}}>{e.score}/{e.total} pts</div>
                    <div style={{fontSize:10,color:"var(--mu)"}}>{e.date}</div></div>
                  <span className={`tag ${e.pct>=70?"tg":e.pct>=45?"to":"tr"}`}>{e.pct}%</span>
                </div>
              ))}
            </div>
          </>)}
        </div>
      )}

      {/* PROFIL */}
      {tab==="profil"&&(
        <div className="wrap" style={{animation:"su .4s ease both"}}>
          <div className="sec">Mon profil</div>
          <div className="card" style={{textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:52,marginBottom:8}}>{profile?.avatar||"🌺"}</div>
            <div style={{fontFamily:"var(--fd)",fontSize:22,fontWeight:800}}>{profile?.name}</div>
            <div style={{color:"var(--mu)",marginTop:3,fontSize:12}}>Candidat·e au Brevet 2026</div>
            {diagProfile&&<div style={{marginTop:9}}><span className="nb" style={{background:NIV[diagProfile.niveau]?.bg,color:NIV[diagProfile.niveau]?.color,display:"inline-flex"}}>{NIV[diagProfile.niveau]?.emoji} {NIV[diagProfile.niveau]?.label}</span></div>}
          </div>
          {profileCode&&(
            <div className="codecard">
              <div className="codelbl">📋 Ton code profil</div>
              <div className="codeval">{profileCode}</div>
              <div className="codesub">Note ce code pour retrouver ton profil sur n'importe quel appareil.</div>
              <button className="btn bgh" style={{padding:"7px 13px",fontSize:11,width:"auto"}}
                onClick={()=>{navigator.clipboard?.writeText(profileCode).then(()=>alert("Copié ! 📋")).catch(()=>alert(profileCode));}}>📋 Copier</button>
            </div>
          )}
          <div className="card" style={{marginBottom:11}}>
            <div style={{fontWeight:700,marginBottom:7,fontSize:13}}>Réinitialiser mes données</div>
            <button className="btn" style={{background:"var(--rd)",color:"white",padding:"8px 14px",fontSize:11,width:"auto"}}
              onClick={async()=>{if(confirm("Effacer tout ?")){setHistory([]);setDiagProfile(null);setProfileCode(null);await save("lh",[]);save("ld",null);save("lpcode",null);setUsedIds([]);setErrCount({});}}}>
              🗑 Réinitialiser
            </button>
          </div>
          <div className="card">
            <div style={{fontWeight:700,marginBottom:7,fontSize:13}}>Changer de profil</div>
            <button className="btn bgh" style={{padding:"8px 13px",fontSize:11,width:"auto"}} onClick={()=>setScreen("setup")}>✏️ Modifier</button>
          </div>
        </div>
      )}

      <nav className="bnav">
        {[["home","Accueil","M3 12L12 3l9 9M5 10v9h5v-5h4v5h5v-9"],
          ["progres","Progrès","M3 3v18h18M7 16l4-4 4 4 4-6"],
          ["profil","Profil","M12 12c2.7 0 4-1.3 4-4s-1.3-4-4-4-4 1.3-4 4 1.3 4 4 4zm0 2c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5z"]
        ].map(([id,label,path])=>(
          <button key={id} className={`ni${tab===id?" on":""}`} onClick={()=>setTab(id)}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={path}/></svg>
            {label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SETUP
// ══════════════════════════════════════════════════════════════
function SetupScreen({onDone}){
  const [name,setName]=useState(""),  [avatar,setAvatar]=useState("🦁");
  const AVS=["🦁","🐯","🦊","🐉","🚀","⚡","🔥","🌟","💎","🎯","🏄","🌴"];
  return(
    <div className="app"><style>{css}</style>
      <div className="setup">
        <div className="sc2">
          <div style={{fontSize:46,textAlign:"center",marginBottom:9}}>🌺</div>
          <div style={{fontFamily:"var(--fd)",fontSize:24,fontWeight:800,textAlign:"center",marginBottom:5}}>
            Brevet<span style={{color:"var(--lea)"}}>Léa</span>
          </div>
          <div style={{color:"var(--mu)",fontSize:12,textAlign:"center",marginBottom:22}}>Léa va d'abord apprendre à te connaître !</div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:"var(--mu)"}}>Ton prénom</label>
            <input className="inp" placeholder="ex: Nawal" value={name} onChange={e=>setName(e.target.value)} maxLength={20}/>
          </div>
          <div style={{marginBottom:22}}>
            <label style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:"var(--mu)"}}>Ton avatar</label>
            <div className="avs">{AVS.map(a=><span key={a} className={`av${avatar===a?" sel":""}`} onClick={()=>setAvatar(a)}>{a}</span>)}</div>
          </div>
          <button className="btn blea" disabled={!name.trim()}
            onClick={()=>onDone({name:name.trim(),avatar,since:new Date().toLocaleDateString("fr-FR")})}>
            Rencontrer Léa 🌺
          </button>
        </div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
